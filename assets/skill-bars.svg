<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#FF1B1B"/>
    </linearGradient>
    <pattern id="stripes" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="transparent"/>
      <rect width="7" height="14" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="700" height="260" fill="#0d0d0d" rx="10"/>

  <!-- title -->
  <text x="20" y="34" font-family="Courier New, monospace" font-size="18" fill="#ff4444" font-weight="bold">// currently_learning.log</text>

  <g font-family="Courier New, monospace" font-size="15" fill="#eaeaea">

    <!-- Cybersecurity 80% -->
    <text x="20" y="66">Cybersecurity</text>
    <rect x="220" y="54" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="54" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="336" dur="1.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="54" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="336" dur="1.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="66" fill="#ff6b6b">80%</text>

    <!-- Java 85% -->
    <text x="20" y="96">Java</text>
    <rect x="220" y="84" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="84" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="357" dur="1.8s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="84" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="357" dur="1.8s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="96" fill="#ff6b6b">85%</text>

    <!-- Python 85% -->
    <text x="20" y="126">Python</text>
    <rect x="220" y="114" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="114" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="357" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="114" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="357" dur="1.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="126" fill="#ff6b6b">85%</text>

    <!-- React 75% -->
    <text x="20" y="156">React</text>
    <rect x="220" y="144" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="144" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="315" dur="1.8s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="144" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="315" dur="1.8s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="156" fill="#ff6b6b">75%</text>

    <!-- Machine Learning 60% -->
    <text x="20" y="186">Machine Learning</text>
    <rect x="220" y="174" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="174" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="252" dur="1.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="174" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="252" dur="1.8s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="186" fill="#ff6b6b">60%</text>

    <!-- Linux 80% -->
    <text x="20" y="216">Linux</text>
    <rect x="220" y="204" width="420" height="16" fill="#1a1a1a" rx="4"/>
    <rect x="220" y="204" height="16" fill="url(#barFill)" rx="4">
      <animate attributeName="width" from="0" to="336" dur="1.8s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <rect x="220" y="204" height="16" width="0" fill="url(#stripes)" rx="4">
      <animate attributeName="width" from="0" to="336" dur="1.8s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
    </rect>
    <text x="648" y="216" fill="#ff6b6b">80%</text>

  </g>

  <!-- blinking log cursor -->
  <rect x="205" y="230" width="10" height="16" fill="#ff1b1b">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="20" y="243" font-family="Courier New, monospace" font-size="13" fill="#666">$ tail -f progress.log</text>
</svg>
