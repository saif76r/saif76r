<svg width="700" height="90" viewBox="0 0 700 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="footerReveal">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="640" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="700" height="90" fill="#000000" rx="8"/>
  <rect x="1" y="1" width="698" height="88" fill="none" stroke="#8B0000" stroke-width="2" rx="8"/>

  <!-- terminal dots -->
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>

  <g clip-path="url(#footerReveal)">
    <text x="30" y="58" font-family="Courier New, monospace" font-size="20" fill="#ff1b1b">
      &gt; system.reboot() ... Sharingan Online.
    </text>
  </g>

  <rect x="608" y="42" width="12" height="20" fill="#ff1b1b">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.09;0.5;1" dur="1.1s" repeatCount="indefinite" begin="2.2s"/>
  </rect>
</svg>
