<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0000">
        <animate attributeName="stop-color" values="#1a0000;#3a0000;#1a0000" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b2b"/>
      <stop offset="70%" stop-color="#c40000"/>
      <stop offset="100%" stop-color="#5a0000"/>
    </radialGradient>

    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" from="0" to="520" dur="2.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </clipPath>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- scanlines drifting down -->
  <g opacity="0.08">
    <rect x="0" y="-20" width="900" height="2" fill="#ff1b1b">
      <animate attributeName="y" from="-20" to="260" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="80" width="900" height="2" fill="#ff1b1b">
      <animate attributeName="y" from="60" to="340" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="180" width="900" height="2" fill="#ff1b1b">
      <animate attributeName="y" from="160" to="440" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Sharingan eye -->
  <g transform="translate(120,130)">
    <circle r="70" fill="url(#eyeGrad)" filter="url(#softGlow)">
      <animate attributeName="r" values="70;73;70" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="none" stroke="#3a0000" stroke-width="4"/>

    <!-- rotating tomoe group -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <g fill="#0a0a0a">
        <path d="M0,-38 C14,-38 22,-24 12,-14 C4,-6 -8,-8 -8,-20 C-8,-30 -6,-38 0,-38 Z"/>
      </g>
      <g fill="#0a0a0a" transform="rotate(120)">
        <path d="M0,-38 C14,-38 22,-24 12,-14 C4,-6 -8,-8 -8,-20 C-8,-30 -6,-38 0,-38 Z"/>
      </g>
      <g fill="#0a0a0a" transform="rotate(240)">
        <path d="M0,-38 C14,-38 22,-24 12,-14 C4,-6 -8,-8 -8,-20 C-8,-30 -6,-38 0,-38 Z"/>
      </g>
    </g>

    <circle r="9" fill="#0a0a0a"/>
  </g>

  <!-- Glitch title: 3 offset copies of the name flickering like chromatic aberration -->
  <g font-family="Courier New, monospace" font-weight="bold" font-size="46">
    <text x="230" y="115" fill="#00f0ff" opacity="0.55">
      MEER SAIF
      <animate attributeName="x" values="230;226;231;230" keyTimes="0;0.4;0.42;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="234" y="115" fill="#ff1b1b" opacity="0.55">
      MEER SAIF
      <animate attributeName="x" values="234;239;233;234" keyTimes="0;0.4;0.42;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="232" y="115" fill="#ffffff">
      MEER SAIF
    </text>
  </g>

  <!-- typewriter-reveal subtitle -->
  <g clip-path="url(#revealClip)">
    <text x="230" y="150" font-family="Courier New, monospace" font-size="20" fill="#ff4444">
      &gt; Software Engineer // Cybersecurity Enthusiast_
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.4s" repeatCount="3"/>
    </text>
  </g>

  <!-- blinking cursor block -->
  <rect x="228" y="170" width="12" height="20" fill="#ff1b1b">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="248" y="187" font-family="Courier New, monospace" font-size="14" fill="#888888">
    system.reboot() :: sharingan.status = ONLINE
  </text>

  <!-- corner brackets, tech-HUD framing -->
  <g stroke="#ff1b1b" stroke-width="2" fill="none" opacity="0.7">
    <path d="M15,15 L15,45 M15,15 L45,15"/>
    <path d="M885,15 L885,45 M885,15 L855,15"/>
    <path d="M15,245 L15,215 M15,245 L45,245"/>
    <path d="M885,245 L885,215 M885,245 L855,245"/>
  </g>
</svg>
